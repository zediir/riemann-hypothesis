# Cache infrastructure; the original submission starts below this block.
platformIndependent = true

name = "tree"
srcDir = "src"
defaultTargets = ["CompanionTheory", "Development", "Formalism", "GroundTheory", "GroundTheoryFields", "Lemmata", "PositivityTheory", "ReciprocityTheory", "Supplements", "Main"]
moreLeanArgs = ["--tstack=400000"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
maxSynthPendingDepth = 3
pp.unicode.fun = true
maxHeartbeats = 4000000

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "31ce06eaadf4a200c0e1407c5f10953cf606b8f8"

[[lean_lib]]
name = "CompanionTheory"
globs = ["CompanionTheory.+"]

[[lean_lib]]
name = "Development"
globs = ["Development.+"]

[[lean_lib]]
name = "Formalism"
globs = ["Formalism.+"]

[[lean_lib]]
name = "GroundTheory"
globs = ["GroundTheory.ArithmeticGeometry.+", "GroundTheory.AutomorphicForms.+", "GroundTheory.Brauer.+", "GroundTheory.FunctionField.+", "GroundTheory.HeightsAndTheta.+", "GroundTheory.IdeleRoots.+", "GroundTheory.PAdicHodge.+", "GroundTheory.PowerSubgroups.+", "GroundTheory.ProfiniteCohomology.+", "GroundTheory.TateCohomology.+"]

[[lean_lib]]
name = "GroundTheoryFields"
globs = ["GroundTheory.LocalFields.+", "GroundTheory.GlobalFields.+"]
leanOptions = {synthInstance.maxHeartbeats = 400000}

[[lean_lib]]
name = "Lemmata"
globs = ["Lemmata.+"]

[[lean_lib]]
name = "PositivityTheory"
globs = ["PositivityTheory.+"]

[[lean_lib]]
name = "ReciprocityTheory"
globs = ["ReciprocityTheory.+"]

[[lean_lib]]
name = "Supplements"
globs = ["Supplements.+"]

[[lean_lib]]
name = "Main"
roots = ["Statements", "Main"]
# --- Everything below this line was added for Comparator; it is not part of the submission ---

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

# Project cache entrypoint. The original submission above is unchanged.
[[lean_exe]]
name = "cache"
root = "scripts.Cache"
srcDir = ".."

# Stock Lake also reads this file as its cache-service configuration.
[cache]
defaultService = "riemann-hypothesis"

[[cache.service]]
name = "riemann-hypothesis"
kind = "s3"
artifactEndpoint = "https://rh-cache.taucetiproject.org/artifacts"
revisionEndpoint = "https://rh-cache.taucetiproject.org/revisions"
